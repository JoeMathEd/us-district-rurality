<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US School District Rurality & Math Proficiency</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .info-panel {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      border-radius: 6px;
      line-height: 1.45;
      min-width: 245px;
      max-width: 315px;
      font-size: 13px;
      color: #1f2937;
    }
    .info-panel h4 { margin: 0 0 6px; font-size: 14px; color: #111827; }
    .legend { line-height: 20px; font-size: 12px; }
    .legend-bar {
      height: 14px;
      width: 100%;
      border-radius: 3px;
      margin: 4px 0 2px;
      border: 1px solid #d1d5db;
    }
    .legend-labels { display: flex; justify-content: space-between; font-size: 11px; color: #4b5563; }
    .na-swatch {
      display: inline-block;
      width: 13px;
      height: 13px;
      background: #cccccc;
      border: 1px solid #9ca3af;
      vertical-align: middle;
      margin-right: 6px;
      border-radius: 2px;
    }
    select { width: 100%; padding: 5px 6px; margin-top: 4px; border-radius: 4px; border: 1px solid #d1d5db; }
    .static-btn-wrap { display: none; margin-top: 8px; }
    .static-btn-wrap button {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #1e293b;
      border-radius: 4px;
      background: #1e293b;
      color: #ffffff;
      cursor: pointer;
    }
    .static-btn-wrap button:hover { background: #334155; }

    /* Right-hand District Profile Drawer */
    #profileDrawer {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 360px;
      max-width: calc(100vw - 24px);
      z-index: 1500;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.28);
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    #profileDrawer.open { display: flex; }
    .drawer-header {
      padding: 14px 16px;
      background: #1e293b;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .drawer-header h3 { margin: 0; font-size: 15px; line-height: 1.3; }
    .drawer-sub { font-size: 11px; color: #cbd5e1; margin-top: 3px; }
    .drawer-close {
      background: rgba(255,255,255,0.14);
      border: none;
      color: #ffffff;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .drawer-close:hover { background: rgba(255,255,255,0.25); }
    .drawer-body { padding: 14px 16px; overflow-y: auto; flex: 1; font-size: 13px; color: #1f2937; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
    }
    .section-title:first-child { margin-top: 0; }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .metric-label { font-size: 11px; color: #64748b; }
    .metric-val { font-size: 14px; font-weight: 700; color: #0f172a; margin-top: 2px; }

    /* Stacked bar chart */
    .chart-meta { font-size: 12px; color: #475569; margin-bottom: 8px; }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #334155;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .grade-row { margin-bottom: 11px; }
    .grade-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .grade-n { font-weight: 400; color: #64748b; font-size: 11px; }
    .stacked-bar {
      display: flex;
      height: 24px;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }
    .bar-seg {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
      transition: opacity 0.15s;
      cursor: default;
    }
    .bar-seg:hover { opacity: 0.88; }
    .bar-suppressed {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #64748b;
      font-style: italic;
      background: repeating-linear-gradient(
        -45deg,
        #f8fafc,
        #f8fafc 6px,
        #e2e8f0 6px,
        #e2e8f0 12px
      );
    }
    .grade-note { font-size: 11px; color: #64748b; margin-top: 3px; }
    .empty-assessment {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    /* High-res lightbox modal */
    #mapModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #mapModal.open { display: flex; }
    .modal-card {
      background: #ffffff;
      border-radius: 8px;
      max-width: 94vw;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      font-weight: 600;
    }
    .modal-actions { display: flex; gap: 10px; align-items: center; }
    .modal-actions a, .modal-actions button {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      text-decoration: none;
      cursor: pointer;
    }
    .modal-body { padding: 12px; overflow: auto; text-align: center; background: #f8fafc; }
    .modal-body img {
      max-width: 100%;
      max-height: 80vh;
      height: auto;
      border: 1px solid #e2e8f0;
      cursor: zoom-in;
    }
    .modal-body img.zoomed {
      max-width: none;
      max-height: none;
      cursor: zoom-out;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- District Profile Drawer -->
  <aside id="profileDrawer" aria-label="District Profile">
    <div class="drawer-header">
      <div>
        <h3 id="drawerName">District Name</h3>
        <div id="drawerSub" class="drawer-sub">GEOID &bull; Locale</div>
      </div>
      <button type="button" class="drawer-close" onclick="closeProfileDrawer()">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- Static PNG Modal -->
  <div id="mapModal" onclick="if(event.target === this) closeStaticMap()">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modalTitle">Labeled State Map (300 DPI)</span>
        <div class="modal-actions">
          <span style="font-size:11px;font-weight:400;color:#6b7280;">Click image to zoom</span>
          <a id="downloadPngLink" href="#" download>Download PNG</a>
          <button onclick="closeStaticMap()">Close</button>
        </div>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Labeled State Rurality Map" onclick="this.classList.toggle('zoomed')" />
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { preferCanvas: true }).setView([39.5, -98.35], 4);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16
    }).addTo(map);

    const LOW_HEX  = '#1e293b';
    const HIGH_HEX = '#8fb996';
    const NA_COLOR = '#cccccc';

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      return [
        parseInt(clean.substring(0, 2), 16),
        parseInt(clean.substring(2, 4), 16),
        parseInt(clean.substring(4, 6), 16)
      ];
    }

    const C_LOW  = hexToRgb(LOW_HEX);
    const C_HIGH = hexToRgb(HIGH_HEX);

    function getColor(pct) {
      if (pct == null || isNaN(pct)) return NA_COLOR;
      const t = Math.max(0, Math.min(1, Number(pct) / 100));
      const r = Math.round(C_LOW[0] + t * (C_HIGH[0] - C_LOW[0]));
      const g = Math.round(C_LOW[1] + t * (C_HIGH[1] - C_LOW[1]));
      const b = Math.round(C_LOW[2] + t * (C_HIGH[2] - C_LOW[2]));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function styleFeature(feature) {
      return {
        fillColor: getColor(feature.properties.pct_rural),
        weight: 0.4,
        opacity: 0.75,
        color: '#ffffff',
        fillOpacity: 0.88
      };
    }

    let currentState = 'ALL';
    let selectedLayer = null;
    let assessmentsByGeoid = {};

    function openStaticMap() {
      if (currentState === 'ALL') return;
      const abbr = currentState.toLowerCase();
      const src = `maps/labeled/${abbr}.png?v=${Date.now()}`;
      document.getElementById('modalTitle').textContent = `${currentState} — Labeled District Map (300 DPI)`;
      const img = document.getElementById('modalImg');
      img.classList.remove('zoomed');
      img.src = src;
      const dl = document.getElementById('downloadPngLink');
      dl.href = src;
      dl.download = `${abbr}_rural_labeled.png`;
      document.getElementById('mapModal').classList.add('open');
    }

    function closeStaticMap() {
      document.getElementById('mapModal').classList.remove('open');
    }

    function closeProfileDrawer() {
      document.getElementById('profileDrawer').classList.remove('open');
      if (selectedLayer && geojsonLayer) {
        geojsonLayer.resetStyle(selectedLayer);
        selectedLayer = null;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeStaticMap();
        closeProfileDrawer();
      }
    });

    function fmtNum(val) {
      return val != null && !isNaN(val) ? Number(val).toLocaleString() : 'N/A';
    }

    function buildAssessmentHtml(geoid) {
      const rec = assessmentsByGeoid[geoid];
      if (!rec || !rec.grades) {
        return `<div class="empty-assessment">Math assessment data is unavailable or suppressed for this district.</div>`;
      }

      const levels = rec.levels || ['Not Proficient', 'Proficient or Above'];
      const palette = rec.palette || (levels.length === 4
        ? ['#d95f02', '#fc8d62', '#66c2a5', '#1b9e77']
        : ['#e07a5f', '#3d5a80']);

      const legendHtml = levels.map((lbl, idx) => `
        <span class="legend-item">
          <span class="legend-dot" style="background:${palette[idx % palette.length]};"></span>${lbl}
        </span>
      `).join('');

      const rowsHtml = ['3', '5', '8'].map(g => {
        const gObj = rec.grades[g];
        const nText = gObj && gObj.n != null ? `n = ${Number(gObj.n).toLocaleString()}` : 'n suppressed';

        if (!gObj || !Array.isArray(gObj.pct) || gObj.pct.length === 0) {
          const reason = (gObj && gObj.note) ? gObj.note : 'Suppressed (small cohort)';
          return `
            <div class="grade-row">
              <div class="grade-header"><span>Grade ${g}</span><span class="grade-n">${nText}</span></div>
              <div class="stacked-bar"><div class="bar-suppressed">${reason}</div></div>
            </div>
          `;
        }

        const segsHtml = gObj.pct.map((val, idx) => {
          const pctVal = Number(val);
          if (pctVal <= 0) return '';
          const color = palette[idx % palette.length];
          const label = pctVal >= 11 ? `${Math.round(pctVal)}%` : '';
          const title = `Grade ${g} — ${levels[idx] || ('Level ' + (idx + 1))}: ${pctVal.toFixed(1)}%`;
          return `<div class="bar-seg" style="width:${pctVal}%;background:${color};" title="${title}">${label}</div>`;
        }).join('');

        const noteHtml = gObj.note ? `<div class="grade-note">${gObj.note}</div>` : '';

        return `
          <div class="grade-row">
            <div class="grade-header"><span>Grade ${g}</span><span class="grade-n">${nText}</span></div>
            <div class="stacked-bar">${segsHtml}</div>
            ${noteHtml}
          </div>
        `;
      }).join('');

      return `
        <div class="chart-meta"><strong>${rec.test_name || 'State Math Assessment'}</strong> (${rec.year || ''})</div>
        <div class="chart-legend">${legendHtml}</div>
        ${rowsHtml}
      `;
    }

    function openProfileDrawer(p) {
      document.getElementById('drawerName').textContent = `${p.name} (${p.state})`;
      document.getElementById('drawerSub').textContent = `GEOID: ${p.geoid} • ${p.locale ?? 'Unknown Locale'}`;

      document.getElementById('drawerBody').innerHTML = `
        <div class="section-title">Rurality & Enrollment Profile</div>
        <div class="metric-grid">
          <div class="metric-card">
            <div class="metric-label">% Rural Students</div>
            <div class="metric-val">${p.pct_rural != null ? p.pct_rural + '%' : 'N/A'}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">CCD Enrollment</div>
            <div class="metric-val">${fmtNum(p.enrollment)}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Est. Rural / Total Pop</div>
            <div class="metric-val">${fmtNum(p.rural_pop)} / ${fmtNum(p.total_pop)}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Weighted Density</div>
            <div class="metric-val">${fmtNum(p.density)} / mi&sup2;</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Operating Schools</div>
            <div class="metric-val">${fmtNum(p.schools)}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Land Area</div>
            <div class="metric-val">${fmtNum(p.area_mi2)} mi&sup2;</div>
          </div>
        </div>

        <div class="section-title">Math Proficiency (Grades 3, 5 & 8)</div>
        ${buildAssessmentHtml(p.geoid)}
      `;

      document.getElementById('profileDrawer').classList.add('open');
    }

    const info = L.control({ position: 'topleft' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info-panel');
      L.DomEvent.disableClickPropagation(this._div);
      this._div.innerHTML = `
        <h4>US School District Rurality</h4>
        <label for="stateSelect" style="font-size:12px;color:#4b5563;">Zoom to State:</label>
        <select id="stateSelect"><option value="ALL">All US Districts</option></select>
        <div id="staticMapBtnWrap" class="static-btn-wrap">
          <button type="button" onclick="openStaticMap()">View Labeled Map (300 DPI)</button>
        </div>
        <div id="hoverDetails" style="margin-top:8px;padding-top:8px;border-top:1px solid #e5e7eb;">
          Hover over or click a school district
        </div>
      `;
      return this._div;
    };
    info.update = function (p) {
      const box = document.getElementById('hoverDetails');
      if (!box) return;
      box.innerHTML = p
        ? `<strong>${p.name}</strong> (${p.state})<br/>
           <span style="color:#4b5563;">NCES Locale:</span> ${p.locale ?? 'N/A'}<br/>
           <span style="color:#4b5563;">% Rural Students:</span> <strong>${p.pct_rural ?? 'N/A'}%</strong><br/>
           <span style="color:#4b5563;">Enrollment:</span> ${fmtNum(p.enrollment)}<br/>
           <span style="font-size:11px;color:#2563eb;">Click district for Grade 3/5/8 math profile</span>`
        : 'Hover over or click a school district';
    };
    info.addTo(map);

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info-panel legend');
      div.innerHTML = `
        <h4>% Rural Students</h4>
        <div class="legend-bar" style="background:linear-gradient(to right, ${LOW_HEX} 0%, ${HIGH_HEX} 100%);"></div>
        <div class="legend-labels"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
        <div style="margin-top:6px;"><span class="na-swatch"></span>No data / NA</div>
      `;
      return div;
    };
    legend.addTo(map);

    let geojsonLayer;
    let allFeatures = [];

    function renderGeoJSON(features) {
      if (geojsonLayer) map.removeLayer(geojsonLayer);
      selectedLayer = null;
      geojsonLayer = L.geoJSON({ type: 'FeatureCollection', features }, {
        style: styleFeature,
        onEachFeature: (feature, layer) => {
          layer.on({
            mouseover: (e) => {
              const target = e.target;
              if (target !== selectedLayer) {
                target.setStyle({ weight: 2, color: '#f59e0b', fillOpacity: 0.96 });
                target.bringToFront();
              }
              info.update(target.feature.properties);
            },
            mouseout: (e) => {
              if (e.target !== selectedLayer) {
                geojsonLayer.resetStyle(e.target);
              }
              info.update();
            },
            click: (e) => {
              L.DomEvent.stopPropagation(e);
              if (selectedLayer && selectedLayer !== e.target) {
                geojsonLayer.resetStyle(selectedLayer);
              }
              selectedLayer = e.target;
              selectedLayer.setStyle({ weight: 2.5, color: '#2563eb', fillOpacity: 0.96 });
              selectedLayer.bringToFront();
              openProfileDrawer(e.target.feature.properties);
            }
          });
        }
      }).addTo(map);
    }

    const v = Date.now();
    Promise.all([
      fetch('data/districts_poc.geojson?v=' + v).then(r => r.json()),
      fetch('data/math_assessments.json?v=' + v).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ])
      .then(([geoData, assessmentData]) => {
        assessmentsByGeoid = assessmentData || {};
        allFeatures = geoData.features;
        const states = [...new Set(allFeatures.map(f => f.properties.state).filter(Boolean))].sort();
        const select = document.getElementById('stateSelect');
        states.forEach(st => {
          const opt = document.createElement('option');
          opt.value = st;
          opt.textContent = st;
          select.appendChild(opt);
        });

        select.addEventListener('change', (e) => {
          currentState = e.target.value;
          closeProfileDrawer();
          const btnWrap = document.getElementById('staticMapBtnWrap');
          if (currentState === 'ALL') {
            btnWrap.style.display = 'none';
            renderGeoJSON(allFeatures);
            map.setView([39.5, -98.35], 4);
          } else {
            btnWrap.style.display = 'block';
            const filtered = allFeatures.filter(f => f.properties.state === currentState);
            renderGeoJSON(filtered);
            map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
          }
        });

        renderGeoJSON(allFeatures);
      })
      .catch(err => console.error('Failed to load map data:', err));
  </script>
</body>
</html>
